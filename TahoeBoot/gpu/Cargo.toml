[package]
name = "tahoeboot-gpu-check"
version = "0.1.0"
edition = "2024"
description = "TahoeBoot dedicated Intel UHD 730 & Reims vGPU compatibility and Vulkan diagnostic tool"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"

[[bin]]
name = "tahoeboot-gpu-check"
path = "src/main.rs"

[dependencies]
ash = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
