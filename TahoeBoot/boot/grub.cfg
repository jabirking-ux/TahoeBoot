set default=0
set timeout=2

insmod all_video
insmod gfxterm
insmod png
insmod serial
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial gfxterm

menuentry "1. TahoeBoot Appliance — Launch macOS Tahoe (Reims vGPU Accelerated)" {
    linux /boot/vmlinuz boot=live console=tty0 console=ttyS0,115200n8 intel_iommu=on iommu=pt kvm-intel.nested=1 tahoeboot.mode=appliance
    initrd /boot/initrd.img
}

menuentry "2. TahoeBoot Maintenance & GPU Diagnostics Mode (tahoeboot-gpu-check)" {
    linux /boot/vmlinuz boot=live console=tty0 console=ttyS0,115200n8 intel_iommu=on iommu=pt kvm-intel.nested=1 tahoeboot.mode=diagnostics
    initrd /boot/initrd.img
}

menuentry "3. UEFI Firmware Settings" {
    fwsetup
}
